# markdownlint config for docs/, README.md, CLAUDE.md
default: true
MD013:
  line_length: 200
  tables: false
  code_blocks: false
MD024:
  siblings_only: true
MD033: false # inline HTML allowed (badges, details)
MD041: false # first line need not be H1 (front matter, ADR tables)
MD060: false # table pipe alignment style is cosmetic; compact separators are our convention
